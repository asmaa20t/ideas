<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Question ❤️</title>

<style>
    body {
        text-align: center;
        font-family: Arial, sans-serif;
        background-color: #ffe6f0;
        margin-top: 100px;
    }

    h1 {
        color: #ff4d88;
    }

    button {
        padding: 15px 25px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    #yesBtn {
        background-color: #ff4d88;
        color: white;
    }

    #noBtn {
        background-color: gray;
        color: white;
        position: absolute;
    }

    #message {
        font-size: 30px;
        color: red;
        margin-top: 40px;
        display: none;
    }
</style>
</head>

<body>

<h1>Will You Be My Valentine? ❤️</h1>

<button id="yesBtn" onclick="showLove()">Yes 💖</button>
<button id="noBtn" onmouseover="moveButton()">No 😢</button>

<div id="message">
    ❤️ I LOVE YOU ❤️
</div>

<script>
function moveButton() {
    let button = document.getElementById("noBtn");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    button.style.left = x + "px";
    button.style.top = y + "px";
}

function showLove() {
    document.getElementById("message").style.display = "block";
}
</script>

</body>
</html>
